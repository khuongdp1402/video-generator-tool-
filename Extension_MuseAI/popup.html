<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 390px;
    margin: 0;
    padding: 16px;
    background: #0b0f17;
    color: #e6edf3;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .header { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .header-icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800;
  }
  .title { font-size: 14px; font-weight: 700; color: #fff; margin: 0; }
  .badge { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; background: rgba(16,185,129,0.2); color: #34d399; }
  .card { background: #141b24; border: 1px solid #223243; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .btn-primary {
    width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: linear-gradient(135deg, #059669, #10b981); color: #fff;
    font-weight: 700; cursor: pointer; margin-bottom: 8px;
  }
  .btn-secondary {
    width: 100%; padding: 8px; border: 1px solid #2b3948; border-radius: 8px;
    background: #17212d; color: #cbd5e1; font-weight: 600; cursor: pointer; margin-bottom: 6px;
  }
  input {
    width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid #243447;
    background: #0d141e; color: #fff; font-size: 12px; margin-top: 4px;
  }
  #log { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 11.5px; display: none; white-space: pre-wrap; }
  #log.show { display: block; background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
</style>
</head>
<body>
  <div class="header">
    <div class="header-icon">⚡</div>
    <div class="title">AI Video Studio Exporter</div>
    <div id="statusBadge" class="badge">LIVE</div>
  </div>
  <div class="card">
    <div class="row"><span>Nền tảng đang mở:</span><strong id="platformName">Đang quét...</strong></div>
    <div class="row"><span>Số lượng Cookie:</span><strong id="cookieCount">0 cookies</strong></div>
  </div>
  <label style="font-size:11px;color:#8b949e;">Tên tài khoản khi đồng bộ vào Studio:
    <input id="labelInput" placeholder="VD: Gemini Ultra 01">
  </label>
  <div style="margin-top:10px;">
    <button id="btnSync" class="btn-primary">⚡ ĐỒNG BỘ 1-CLICK VÀO STUDIO (PORT 3050)</button>
    <button id="btnCopy" class="btn-secondary">📋 Sao Chép Cookie JSON</button>
    <button id="btnExport" class="btn-secondary">💾 Xuất File JSON Về Máy</button>
  </div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
