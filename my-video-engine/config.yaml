# Non-secret configuration. Secrets (API keys, OAuth client paths) live in .env — see .env.example.

fps: 30
resolution:
  width: 1080
  height: 1920

tts:
  voice: "vi-VN-NamMinhNeural"
  rate: "-5%"
  padding_seconds: 0.5

whisper:
  model: "base"

ai:
  provider: "agentgw"
  base_url: "https://agentgw.cloud/v1"
  model: "agentgw-opus-4-8"
  fallback_model: "gemini-1.5-pro"
  num_scenes: 7
  min_score: 85
  max_attempts: 3

markets:
  US:
    language: "en"
    locale: "en-US"
    voice: "en-US-AndrewMultilingualNeural"
    rate: "+0%"
    font_family: "Plus Jakarta Sans, Montserrat, sans-serif"
    youtube_category_id: "27"
    youtube_token_file: "token_us.json"
  JP:
    language: "ja"
    locale: "ja-JP"
    voice: "ja-JP-KeitaNeural"
    rate: "-2%"
    font_family: "Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"
    youtube_category_id: "27"
    youtube_token_file: "token_jp.json"
  VI:
    language: "vi"
    locale: "vi-VN"
    voice: "vi-VN-NamMinhNeural"
    rate: "-5%"
    font_family: "Be Vietnam Pro, Montserrat, sans-serif"
    youtube_category_id: "22"
    youtube_token_file: "token.json"

render:
  crossfade_seconds: 0.5
  kenburns_end_scale: 1.1
  subtitle:
    font_family: "Plus Jakarta Sans, Noto Sans JP, Be Vietnam Pro, Montserrat, sans-serif"
    font_size_px: 64
    stroke_px: 6
    highlight_color: "#FFD400"

paths:
  data_file: "src/data/video_data.json"
  audio_dir: "public/audio"
  media_dir: "public/media"
  output_dir: "output"
  logs_dir: "logs"

youtube:
  privacy_status: "private" # private | unlisted | public
  category_id: "27"

tiktok:
  privacy_level: "SELF_ONLY" # SELF_ONLY | PUBLIC_TO_EVERYONE | MUTUAL_FOLLOW_FRIENDS
