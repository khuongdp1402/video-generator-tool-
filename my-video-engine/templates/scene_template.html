<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: ${WIDTH}px;
    height: ${HEIGHT}px;
    overflow: hidden;
    background: #0b0f19;
    font-family: ${FONT_FAMILY}, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
    will-change: transform;
  }
  .subtitle {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 92px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
    padding: 0 56px;
    line-height: 1.35;
    z-index: 3;
    pointer-events: none;
  }
  .subtitle.lang-ja {
    gap: 6px 3px;
    line-height: 1.52;
  }
  .word {
    font-size: ${FONT_SIZE_PX}px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.72);
    -webkit-text-stroke: ${STROKE_PX}px rgba(10, 15, 28, 0.96);
    paint-order: stroke fill;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.55);
    transition: none;
  }
  .word.past { color: #ffffff; }
  .word.active { color: #ffffff; transform: scale(1.06); }
  .word.active.highlight { color: ${HIGHLIGHT_COLOR}; }
  .word.past.highlight { color: ${HIGHLIGHT_COLOR}; }

  .progress-bar-bg {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 52px;
    height: 6px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.28);
    overflow: hidden;
    z-index: 3;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: ${HIGHLIGHT_COLOR};
  }
</style>
</head>
<body>
  <div class="frame">
    <img class="bg" id="bg" src="${IMAGE_DATA_URI}" />
    <div class="subtitle" id="subtitle"></div>
    <div class="progress-bar-bg" id="progressBg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

<script>
  const DURATION = ${DURATION_SECONDS};
  const END_SCALE = ${END_SCALE};
  const LANGUAGE = ${LANGUAGE_JSON};
  const TRANSPARENT_BG = ${TRANSPARENT_BG_JSON};
  const WORDS = ${WORDS_JSON};
  const rawHighlights = ${HIGHLIGHT_WORDS_JSON} || [];
  const HIGHLIGHT_LIST = rawHighlights.map(w => normalize(String(w)));
  const HIGHLIGHT = new Set(HIGHLIGHT_LIST);

  const bg = document.getElementById("bg");
  const subtitleEl = document.getElementById("subtitle");
  const progressFill = document.getElementById("progressFill");

  function normalize(w) {
    return String(w || "")
      .toLowerCase()
      .replace(/[.,!?;:"'()[\]{}。、！？「」『』（）・…\s]/g, "");
  }

  function checkHighlight(word) {
    const norm = normalize(word);
    if (!norm) return false;
    if (HIGHLIGHT.has(norm)) return true;
    if (LANGUAGE === "ja") {
      return HIGHLIGHT_LIST.some(h => h.length >= 2 && (norm.includes(h) || h.includes(norm)));
    }
    return false;
  }

  if (TRANSPARENT_BG) {
    document.documentElement.style.background = "transparent";
    document.body.style.background = "transparent";
    bg.style.display = "none";
  }

  if (LANGUAGE === "ja") {
    subtitleEl.classList.add("lang-ja");
  }

  // Chia phụ đề thành từng cụm ngắn 6-7 từ chuẩn TikTok/Shorts (không che lấp hình ảnh video)
  const CHUNK_SIZE = LANGUAGE === "ja" ? 5 : 7;
  const CHUNKS = [];
  for (let i = 0; i < WORDS.length; i += CHUNK_SIZE) {
    const slice = WORDS.slice(i, i + CHUNK_SIZE);
    CHUNKS.push({
      start: slice[0].start,
      end: slice[slice.length - 1].end,
      words: slice
    });
  }

  let renderedChunkIdx = -1;

  window.setFrame = function (t) {
    const progress = Math.min(1, Math.max(0, t / Math.max(0.1, DURATION)));
    if (!TRANSPARENT_BG) {
      const scale = 1 + (END_SCALE - 1) * progress;
      bg.style.transform = `scale(${scale})`;
    }
    if (progressFill) progressFill.style.width = `${(progress * 100).toFixed(1)}%`;

    if (CHUNKS.length === 0) return;

    let activeChunkIdx = CHUNKS.findIndex(c => t >= c.start && t <= c.end + 0.08);
    if (activeChunkIdx === -1) {
      // Giữa các khoảng nghỉ ngắn, giữ cụm vừa đọc hoặc cụm đầu tiên
      activeChunkIdx = 0;
      for (let cIdx = 0; cIdx < CHUNKS.length; cIdx++) {
        if (t >= CHUNKS[cIdx].start) activeChunkIdx = cIdx;
      }
    }

    if (activeChunkIdx !== renderedChunkIdx) {
      renderedChunkIdx = activeChunkIdx;
      const joiner = LANGUAGE === "ja" ? "" : " ";
      subtitleEl.innerHTML = CHUNKS[activeChunkIdx].words
        .map((w, idx) => `<span class="word" data-i="${idx}">${w.word}</span>`)
        .join(joiner);
    }

    const spans = subtitleEl.querySelectorAll(".word");
    const activeWords = CHUNKS[activeChunkIdx].words;
    activeWords.forEach((w, i) => {
      const span = spans[i];
      if (!span) return;
      const isHighlight = checkHighlight(w.word);
      span.classList.toggle("highlight", isHighlight);
      if (t >= w.end) {
        span.classList.add("past");
        span.classList.remove("active");
      } else if (t >= w.start) {
        span.classList.add("active");
        span.classList.remove("past");
      } else {
        span.classList.remove("active", "past");
      }
    });
  };

  window.setFrame(0);
</script>
</body>
</html>
