<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Noto+Sans+JP:wght@600;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: ${WIDTH}px;
    height: ${HEIGHT}px;
    overflow: hidden;
    background: #05030a;
    font-family: ${FONT_FAMILY};
  }
  .frame { position: relative; width: 100%; height: 100%; }
  .bg-blur {
    position: absolute;
    inset: -40px;
    width: calc(100% + 80px);
    height: calc(100% + 80px);
    object-fit: cover;
    filter: blur(32px) brightness(0.42) saturate(1.15);
    transform-origin: center center;
  }
  .bg {
    position: absolute;
    top: 290px;
    left: 36px;
    width: calc(100% - 72px);
    height: calc(100% - 720px);
    object-fit: contain;
    border-radius: 28px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.72);
    transform-origin: center center;
    will-change: transform;
    z-index: 2;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.12) 32%, rgba(0,0,0,0.08) 72%, rgba(0,0,0,0.52) 100%);
    z-index: 1;
  }
  .hero-badge-wrap {
    position: absolute;
    top: 84px;
    left: 60px;
    right: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }
  .scene-pill {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.78);
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.2);
    padding: 10px 26px;
    border-radius: 999px;
    margin-bottom: 32px;
  }
  .hero-keyword {
    font-size: 86px;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: ${HIGHLIGHT_COLOR};
    text-shadow: 0 10px 36px rgba(0,0,0,0.85);
    line-height: 1.15;
    padding: 18px 36px;
    border-radius: 24px;
    background: rgba(8, 10, 24, 0.55);
    border: 2px solid rgba(255, 212, 0, 0.35);
  }
  .progress-bar-bg {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 64px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    overflow: hidden;
    z-index: 3;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: ${HIGHLIGHT_COLOR};
  }
  .subtitle {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 105px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 14px;
    padding: 0 60px;
    line-height: 1.45;
    z-index: 3;
  }
  .subtitle.lang-ja {
    gap: 6px 3px;
    line-height: 1.55;
  }
  .word {
    font-size: ${FONT_SIZE_PX}px;
    font-weight: 800;
    color: rgba(255,255,255,0.42);
    -webkit-text-stroke: ${STROKE_PX}px rgba(0,0,0,0.92);
    paint-order: stroke fill;
    text-shadow: 0 4px 16px rgba(0,0,0,0.65);
    transition: none;
  }
  .word.past { color: #ffffff; }
  .word.active { color: #ffffff; transform: scale(1.04); }
  .word.active.highlight { color: ${HIGHLIGHT_COLOR}; }
  .word.past.highlight { color: ${HIGHLIGHT_COLOR}; }

  .lesson-card {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
    text-align: center;
    background: radial-gradient(circle at center, rgba(25, 18, 48, 0.92), rgba(5, 3, 12, 0.98));
  }
  .lesson-card.visible { display: flex; }
  .lesson-badge {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: ${HIGHLIGHT_COLOR};
    border: 2px solid ${HIGHLIGHT_COLOR};
    padding: 10px 28px;
    border-radius: 999px;
    margin-bottom: 36px;
  }
  .lesson-body {
    font-size: ${FONT_SIZE_PX}px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.45;
    max-width: 85%;
    text-shadow: 0 6px 24px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
  <div class="frame">
    <img class="bg-blur" id="bgBlur" src="${IMAGE_DATA_URI}" />
    <img class="bg" id="bg" src="${IMAGE_DATA_URI}" />
    <div class="scrim"></div>
    <div class="hero-badge-wrap" id="heroWrap">
      <div class="scene-pill" id="scenePill"></div>
      <div class="hero-keyword" id="heroKeyword"></div>
    </div>
    <div class="subtitle" id="subtitle"></div>
    <div class="progress-bar-bg" id="progressBg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="lesson-card" id="lessonCard">
      <div class="lesson-badge" id="lessonTitle"></div>
      <div class="lesson-body" id="lessonBody"></div>
    </div>
  </div>

<script>
  const DURATION = ${DURATION_SECONDS};
  const END_SCALE = ${END_SCALE};
  const LANGUAGE = ${LANGUAGE_JSON};
  const SCENE_TYPE = ${SCENE_TYPE_JSON};
  const LESSON_TITLE = ${LESSON_TITLE_JSON};
  const SCENE_TEXT = ${SCENE_TEXT_JSON};
  const TRANSPARENT_BG = ${TRANSPARENT_BG_JSON};
  const WORDS = ${WORDS_JSON};
  const rawHighlights = ${HIGHLIGHT_WORDS_JSON} || [];
  const HIGHLIGHT_LIST = rawHighlights.map(w => normalize(String(w)));
  const HIGHLIGHT = new Set(HIGHLIGHT_LIST);

  const bg = document.getElementById("bg");
  const subtitleEl = document.getElementById("subtitle");
  const lessonCard = document.getElementById("lessonCard");
  const heroWrap = document.getElementById("heroWrap");
  const scenePill = document.getElementById("scenePill");
  const heroKeyword = document.getElementById("heroKeyword");
  const progressFill = document.getElementById("progressFill");

  scenePill.textContent = LANGUAGE === "ja" ? "ポイント" : (LANGUAGE === "vi" ? "ĐIỂM NHẤN" : "KEY INSIGHT");
  if (rawHighlights.length > 0) {
    heroKeyword.textContent = rawHighlights.slice(0, 2).join(" • ");
  } else {
    heroKeyword.style.display = "none";
  }

  function normalize(w) {
    return String(w || "")
      .toLowerCase()
      .replace(/[.,!?;:"'()[\]{}。、！？「」『』（）・…\s]/g, "");
  }

  function checkHighlight(word) {
    const norm = normalize(word);
    if (!norm) return false;
    if (HIGHLIGHT.has(norm)) return true;
    if (LANGUAGE === "ja") {
      return HIGHLIGHT_LIST.some(h => h.length >= 2 && (norm.includes(h) || h.includes(norm)));
    }
    return false;
  }

  if (TRANSPARENT_BG) {
    document.documentElement.style.background = "transparent";
    document.body.style.background = "transparent";
    bg.style.display = "none";
    const bgBlur = document.getElementById("bgBlur");
    if (bgBlur) bgBlur.style.display = "none";
  }

  if (LANGUAGE === "ja") {
    subtitleEl.classList.add("lang-ja");
  }

  if (SCENE_TYPE === "lesson") {
    scenePill.textContent = LESSON_TITLE || (LANGUAGE === "vi" ? "BÀI HỌC CỐT LÕI" : "KEY TAKEAWAY");
  }
  const joiner = LANGUAGE === "ja" ? "" : " ";
  subtitleEl.innerHTML = WORDS.map((w, i) =>
    `<span class="word" data-i="${i}">${w.word}</span>`
  ).join(joiner);
  const spans = subtitleEl.querySelectorAll(".word");

  window.setFrame = function (t) {
    const progress = Math.min(1, Math.max(0, t / Math.max(0.1, DURATION)));
    const scale = 1 + (END_SCALE - 1) * progress;
    bg.style.transform = `scale(${scale})`;
    if (progressFill) progressFill.style.width = `${(progress * 100).toFixed(1)}%`;

    WORDS.forEach((w, i) => {
      const span = spans[i];
      if (!span) return;
      const isHighlight = checkHighlight(w.word);
      span.classList.toggle("highlight", isHighlight);
      if (t >= w.end) {
        span.classList.add("past");
        span.classList.remove("active");
      } else if (t >= w.start) {
        span.classList.add("active");
        span.classList.remove("past");
      } else {
        span.classList.remove("active", "past");
      }
    });
  };

  window.setFrame(0);
</script>
</body>
</html>
